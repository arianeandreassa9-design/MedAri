<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#16293A">
<title>MediAri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--mid:#16293A;--teal:#004456;--teal2:#5F989D;--sky:#B7D9FE;--pearl:#EDEDED;--cream:#FBF8F2;--ink:#16293A;--mut:#5b6b78;--line:#dfe5ea}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.55;font-size:15px}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
a{color:var(--teal)}
button{font:inherit;cursor:pointer}
/* Home */
#home{min-height:100vh}
.cover{height:190px;background:linear-gradient(120deg,var(--teal) 0%,var(--teal2) 100%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cover .wm{font-family:'Cormorant Garamond',serif;font-size:96px;color:#fff;letter-spacing:1px;line-height:1;opacity:.96}
.cover .wm i{font-style:italic}
.cover .sub{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--sky);font-size:11px;letter-spacing:.38em;text-transform:uppercase}
.cover img.bg{position:absolute;right:-50px;top:-30px;width:300px;opacity:.14}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px 60px}
.icon{width:84px;height:84px;margin-top:-42px;background:#fff;border-radius:18px;display:grid;place-items:center;position:relative;box-shadow:0 2px 10px rgba(22,41,58,.12)}
.icon img{width:60px}
h1.title{font-family:'Cormorant Garamond',serif;font-size:42px;font-weight:600;margin:14px 0 4px}
.tag{color:var(--mut);font-size:14px;margin-bottom:6px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0 22px}
.cols{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:34px;align-items:start}
.sec h2{background:var(--pearl);font-family:'Cormorant Garamond',serif;font-weight:600;font-size:22px;padding:4px 12px;border-radius:4px;margin:0 0 6px}
.sec+.sec{margin-top:22px}
.sec h2{border-bottom:2px solid var(--sky)}
.lnk{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:6px;color:var(--ink);font-size:14.5px}
.lnk:hover{background:#eef5fd}
.lnk .e{width:22px;text-align:center}
.lnk .t{border-bottom:1px solid #cfd8df}
.center{display:flex;justify-content:center}
.heroimg{width:100%;max-width:300px;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block}
.hero{width:100%;max-width:300px;aspect-ratio:3/4;border-radius:6px;background:linear-gradient(160deg,var(--teal),var(--mid));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;text-align:center;padding:26px;position:relative;overflow:hidden}
.hero svg{width:130px}
.hero .wm{font-family:'Cormorant Garamond',serif;font-size:38px;line-height:1}
.hero .wm i{font-style:italic}
.hero p{font-size:12.5px;color:var(--sky);line-height:1.4}
details.proj{margin-top:14px}
details.proj summary{cursor:pointer;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;padding:4px 0}
.bar{height:22px;background:var(--pearl);border-radius:4px;margin:26px 0 18px}
h3.est{font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:12px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;text-align:left;padding:0}
.card:hover{box-shadow:0 4px 14px rgba(22,41,58,.1)}
.card .ph{height:104px;background:linear-gradient(135deg,var(--mid),var(--teal));display:grid;place-items:center;font-size:30px}
.card:nth-child(2) .ph{background:linear-gradient(135deg,#cfd8df,#ECEFF2)}
.card:nth-child(3) .ph{background:linear-gradient(135deg,var(--teal),var(--teal2))}
.card:nth-child(4) .ph{background:linear-gradient(135deg,var(--sky),#dcecff)}
.card .n{padding:9px 12px;font-size:14px}
/* App */
#app{display:none;min-height:100vh}
#app.on{display:flex}
aside{width:272px;background:var(--mid);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
aside .brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
aside .brand img{width:32px}
aside .brand span{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600}
aside .brand span i{font-style:italic}
.btn-home{width:100%;display:flex;align-items:center;gap:9px;background:var(--teal);color:#fff;border:0;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-weight:500}
.btn-home:hover{background:var(--teal2)}
aside .g{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--sky);opacity:.8;margin:16px 8px 4px}
aside button.n{width:100%;display:flex;align-items:center;gap:9px;background:none;border:0;color:#e8eef3;text-align:left;padding:7px 10px;border-radius:7px;font-size:14px}
aside button.n:hover{background:rgba(255,255,255,.08)}
aside button.n.on{background:rgba(183,217,254,.18);color:#fff}
main{flex:1;min-width:0;background:var(--cream)}
.mtop{display:none;background:var(--mid);color:#fff;padding:10px 14px;align-items:center;gap:10px}
.mtop button{background:none;border:0;color:#fff;font-size:22px}
.page{max-width:860px;margin:0 auto;padding:44px 34px 90px}
.page.wide{max-width:none;padding:0}
#dashframe{width:100%;height:calc(100vh - 34px);border:0;display:block;background:#fff}
.crumb{font-size:12px;color:var(--mut);margin-bottom:10px}
.page h1{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:600;line-height:1.1;margin-bottom:6px}
.page h1 .e{margin-right:8px}
.page h2{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:600;margin:30px 0 8px;color:var(--teal)}
.page h3{font-size:16px;font-weight:600;margin:20px 0 6px}
.page p{margin:8px 0}
.page ul,.page ol{margin:8px 0 8px 22px}
.page li{margin:3px 0}
.co{background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal2);border-radius:8px;padding:12px 16px;margin:14px 0}
.co.y{border-left-color:#e0b43a;background:#fff9e8}
.co.o{border-left-color:#e08a3a;background:#fff3e8}
.co.b{border-left-color:var(--sky);background:#f1f7ff}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13.5px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:#eef5fd;font-weight:600}
details{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:8px 0}
details summary{cursor:pointer;font-weight:500}
details>*:not(summary){margin-top:8px}
pre{background:var(--mid);color:#e8eef3;padding:14px;border-radius:8px;white-space:pre-wrap;font-size:12.5px;line-height:1.5;margin:12px 0;font-family:ui-monospace,Menlo,monospace}
.chk{display:flex;gap:9px;align-items:flex-start;margin:5px 0}
.chk input{margin-top:5px;accent-color:var(--teal)}
.chk input:checked+span{text-decoration:line-through;color:var(--mut)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:12px 0}
.grid3 .co{margin:0}
.open{display:inline-flex;gap:6px;align-items:center;background:var(--teal);color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:13.5px;margin:6px 0}
.open.alt{background:#fff;color:var(--teal);border:1px solid var(--teal)}
.subl{display:block;padding:7px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.subl:hover{color:var(--teal)}
.mut{color:var(--mut);font-size:13.5px}
textarea.note{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;background:#fff;margin:4px 0 10px}
@media(max-width:860px){
 .cols{grid-template-columns:1fr}.center{order:-1}.cover .wm{font-size:60px}
 aside{position:fixed;left:-290px;z-index:20;transition:left .2s}aside.open{left:0}
 .mtop{display:flex}.page{padding:26px 18px 70px}
}
</style>
</head>

/* render */
const $=s=>document.querySelector(s);
const lnkBtn=(p)=>`<button class="lnk" onclick="openPage('${p.id}')"><span class="e">${p.e}</span><span class="t">${p.t}</span></button>`;
function buildHome(){
  const g=Object.fromEntries(DATA.groups);
  const sec=(name)=>`<div class="sec"><h2>${name}</h2>${g[name].map(lnkBtn).join('')}</div>`;
  $('#colL').innerHTML=sec('pessoal')+sec('visualizar')+sec('acompanhamento');
  $('#colR').innerHTML=sec('business')+
   `<details class="proj"><summary>meus projetos</summary>${[0,1,2].map(k=>lnkBtn(P['proj'+k])).join('')}</details>`+sec('estratégia');
  $('#gal').innerHTML=[0,1,2,3].map(k=>`<button class="card" onclick="openPage('est${k}')"><div class="ph">${P['est'+k].e}</div><div class="n">${P['est'+k].t}</div></button>`).join('');
}
function buildNav(){
  let h='';
  DATA.groups.forEach(([g,items])=>{
    h+=`<div class="g">${g}</div>`+items.map(p=>`<button class="n" data-id="${p.id}" onclick="openPage('${p.id}')">${p.e} ${p.t}</button>`).join('');
    if(g==='business') h+=`<div class="g">meus projetos</div>`+[0,1,2].map(k=>`<button class="n" data-id="proj${k}" onclick="openPage('proj${k}')">📁 ${P['proj'+k].t.length>30?P['proj'+k].t.slice(0,28)+'…':P['proj'+k].t}</button>`).join('');
  });
  h+=`<div class="g">estudos</div>`+[0,1,2,3].map(k=>`<button class="n" data-id="est${k}" onclick="openPage('est${k}')">${P['est'+k].e} ${P['est'+k].t}</button>`).join('');
  $('#nav').innerHTML=h;
}
async function unlockDNA(){
  if(window.__dna) return window.__dna;
  let pw=null; try{pw=sessionStorage.getItem('mediari:pw')}catch(e){}
  for(let tries=0;tries<3;tries++){
    if(!pw) pw=prompt('Esta página é protegida. Digite a senha:');
    if(!pw) return null;
    try{
      const b=Uint8Array.from(atob(DNA_ENC),c=>c.charCodeAt(0));
      const salt=b.slice(0,16),iv=b.slice(16,28),ct=b.slice(28);
      const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
      window.__dna=new TextDecoder().decode(pt);
      try{sessionStorage.setItem('mediari:pw',pw)}catch(e){}
      return window.__dna;
    }catch(e){ pw=null; try{sessionStorage.removeItem('mediari:pw')}catch(_){} alert('Senha incorreta.'); }
  }
  return null;
}
function jump(i){const el=document.getElementById(i); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return false}
function copyPrompt(b){navigator.clipboard.writeText(document.getElementById('prompt').innerText).then(()=>{b.textContent='Copiado ✓';setTimeout(()=>b.textContent='Copiar prompt',1800)})}
async function openPage(id){
  const p=P[id]; if(!p) return;
  if(id==='dna' && !HTML.dna){ const h=await unlockDNA(); if(!h) return; HTML.dna=h; }
  $('#home').style.display='none'; $('#app').classList.add('on');
  document.querySelectorAll('#nav .n').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  let body=HTML[id];
  if(p.dash){
    $('#page').className='page wide';
    $('#page').innerHTML=`<iframe id="dashframe" title="${p.t}" src="versao-anterior/?embed=1&v=${p.dash}" allow="clipboard-write"></iframe><p class="mut" style="margin-top:10px">Se aparecer a tela de login, entre com a sua conta Google. Os dados são os mesmos de antes, direto do Firebase.</p>`;
    document.querySelectorAll('#nav .n').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
    window.scrollTo(0,0); $('#side').classList.remove('open'); try{history.replaceState(null,'','#'+id)}catch(e){} return;
  }
  $('#page').className='page';
  if(p.priv) body=priv(p);
  else if(!body) body=tpl(p, id.startsWith('est')?'Item da galeria “estudos”. No Notion ele ainda está vazio.':null);
  if(!p.priv && !id.startsWith('est') && id!=='dna' && HTML[id] && !['escoteiro','claude'].includes(id)) body+=`<p style="margin-top:26px">${openBtn(p.url)}</p>`;
  $('#page').innerHTML=`<div class="crumb">MediAri / ${p.g}</div><h1><span class="e">${p.e}</span>${p.t}</h1>${body}`;
  hydrate(); window.scrollTo(0,0); $('#side').classList.remove('open');
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
function goHome(){ $('#app').classList.remove('on'); $('#home').style.display='block'; window.scrollTo(0,0); try{history.replaceState(null,'',location.pathname)}catch(e){} }
function hydrate(){
  document.querySelectorAll('#page [data-k]').forEach(el=>{
    let v=null; try{v=localStorage.getItem('mediari:'+el.dataset.k)}catch(e){}
    if(el.type==='checkbox'){el.checked=v==='1';el.onchange=()=>{try{localStorage.setItem('mediari:'+el.dataset.k,el.checked?'1':'0')}catch(e){}}}
    else{ if(v) el.value=v; el.oninput=()=>{try{localStorage.setItem('mediari:'+el.dataset.k,el.value)}catch(e){}}}
  });
}
buildHome(); buildNav();
if(location.hash && P[location.hash.slice(1)]) openPage(location.hash.slice(1));
